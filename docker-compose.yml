services:
  satsplit:
    build: .
    ports:
      - "8080:8080"
    environment:
      SAT_SPLIT_ADDR: ":8080"
      SAT_SPLIT_DB: "/data/satsplit.db"
      SAT_SPLIT_UPLOAD_DIR: "/data/uploads"
      TESSERACT_CMD: "tesseract"
      TESSERACT_LANG: "eng"
      TRANSLATE_URL: "http://translate:8001"
      # Receipt reader: any OpenAI-compatible vision API. With VISION_URL set,
      # the vision model is the only reader and Tesseract is not used.
      # The default below is the local llama.cpp service; on CPU it is slow.
      # For a hosted model use the provider's base URL and set VISION_API_KEY
      # and VISION_MODEL. VISION_FALLBACK_MODEL is a second model that is asked
      # only when the first one's items do not add up to the printed total.
      VISION_URL: "${VISION_URL:-http://llama:8081}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_MODEL: "${VISION_MODEL:-}"
      VISION_FALLBACK_MODEL: "${VISION_FALLBACK_MODEL:-}"
      # Public address used in share links, for example https://split.example.com
      SAT_SPLIT_BASE_URL: "${SAT_SPLIT_BASE_URL:-}"
    volumes:
      - satsplit-data:/data
    depends_on:
      translate:
        condition: service_healthy

  translate:
    build: translate/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --host 0.0.0.0
      --port 8081
      -m /models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      --mmproj /models/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf
      -ngl 0
      -c 4096
    volumes:
      - llama-models:/models

volumes:
  satsplit-data:
  llama-models:
